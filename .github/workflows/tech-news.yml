name: Ingest RSS inbox

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RSS feeds into editorial inbox
        run: python3 .github/scripts/update-tech-news.py
      - name: Commit inbox only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ingest/rss-inbox.json
          git diff --cached --quiet || git commit -m 'Update RSS editorial inbox'
          git push

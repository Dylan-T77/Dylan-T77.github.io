name: Update Tech Intelligence

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RSS feeds
        run: python3 .github/scripts/update-tech-news.py
      - name: Commit updated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tech-news.json
          git diff --cached --quiet || git commit -m 'Update Tech Intelligence feed'
          git push
